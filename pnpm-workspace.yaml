packages:
  - apps/*
  - packages/*
  - tools/*
  - db
onlyBuiltDependencies:
  - esbuild
overrides:
  # exceljs pins uuid 8; it only uses v4, but 11.1.1 closes GHSA-w5hq-g745-h8pq anyway.
  'exceljs>uuid': 11.1.1
  # Security fixes in libraries we only get through others (GitHub's alerts, 2026-11-03). Each is
  # the same major version the parent asks for; remove a line once the parent requires it itself.
  # fast-uri: Fastify's ajv-compiler (^4) and ajv (^3); GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr.
  'fast-uri@^4': 4.2.3
  'fast-uri@^3': 3.1.9
  # seroval: TanStack Router (^1.6.7); GHSA-f86p-h4j2-7qgj, GHSA-9wx9-5pv9-3349.
  'seroval@^1.6.0': 1.6.12
  # undici: jsdom, in the screen tests only (never in the app); eight advisories fixed in 8.12.2.
  'undici@^8': 8.12.3
