[workspace]
members = [".", "bridge", "printer"]
resolver = "3"

[package]
name = "artepool-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "LicenseRef-ARTEPOOL-internal"
description = "ARTÉPOOL ERP for Windows"

[lib]
name = "artepool_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
artepool-bridge = { path = "bridge" }
artepool-printer = { path = "printer" }
base64 = "0.23"
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.13"

# Argon2id (64 MiB) is slow without optimisation; dev builds and tests optimise dependencies.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
