name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    name: Check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway CI database only — not real credentials.
      PGHOST: localhost
      PGPORT: '5432'
      PG_SUPERUSER: postgres
      PG_SUPERUSER_PASSWORD: postgres
      ARTEPOOL_DB: artepool_dev
      ARTEPOOL_TEST_DB: artepool_test
      ARTEPOOL_MIGRATOR_PASSWORD: ci-only-migrator
      ARTEPOOL_API_PASSWORD: ci-only-api
      ARTEPOOL_BACKUP_PASSWORD: ci-only-backup
      ARTEPOOL_MAINT_PASSWORD: ci-only-maint
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint, formatting, typecheck, translations
        run: pnpm check
      - name: Unit tests
        run: pnpm test:unit
      - name: Create database roles and the dev database
        run: pnpm db:setup
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Migration checksums
        run: pnpm db:status
      - name: Generated database types are up to date
        run: pnpm db:codegen:check
      - name: Chromium for the A4 PDF renderer
        run: pnpm --filter @artepool/server exec playwright-core install --with-deps chromium-headless-shell
      - name: PostgreSQL 18 programs (pg_dump / pg_restore for the backup tests; initdb / pg_ctl for the power-loss test)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          # The server programs only: no cluster of their own (the tests use the service above).
          sudo install -d /etc/postgresql-common
          echo "create_main_cluster = false" | sudo tee /etc/postgresql-common/createcluster.conf
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Dpkg::Options::=--force-confold postgresql-client-18 postgresql-18
          echo "ARTEPOOL_PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
      - name: Integration tests (database rules, concurrency, server, backups)
        run: pnpm test:integration
      - name: Audit chain check
        run: pnpm audit:verify
      - name: Tamper demo is caught
        run: pnpm demo:audit-tamper

  screens:
    name: Screen tests (Playwright, Arabic + English)
    runs-on: ubuntu-24.04
    # 86 flows in two languages, one at a time: about 30 minutes on the runner.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Throwaway CI database only — not real credentials.
      PGHOST: localhost
      PGPORT: '5432'
      PG_SUPERUSER: postgres
      PG_SUPERUSER_PASSWORD: postgres
      ARTEPOOL_DB: artepool_dev
      ARTEPOOL_TEST_DB: artepool_test
      ARTEPOOL_MIGRATOR_PASSWORD: ci-only-migrator
      ARTEPOOL_API_PASSWORD: ci-only-api
      ARTEPOOL_BACKUP_PASSWORD: ci-only-backup
      ARTEPOOL_MAINT_PASSWORD: ci-only-maint
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Chromium for Playwright
        run: pnpm --filter @artepool/desktop exec playwright install --with-deps chromium
      - name: PostgreSQL 18 client tools (pg_dump / pg_restore for the restore flow)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "ARTEPOOL_PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
      - name: Screen flows against the real API (throwaway database)
        run: pnpm test:e2e
      # The page as it was when a test failed (Playwright's accessibility snapshot of the screen,
      # test data only), so the cause can be read here without downloading the artifact.
      - name: The screen at each failure
        if: failure()
        working-directory: apps/desktop
        run: |
          find test-results -name error-context.md -print0 2>/dev/null |
            while IFS= read -r -d '' file; do echo "::group::$file"; cat "$file"; echo "::endgroup::"; done
      - name: Screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: |
            apps/desktop/e2e-screens/
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          retention-days: 14
          if-no-files-found: ignore

  rust:
    name: PC secure side (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PG_SUPERUSER: postgres
      PG_SUPERUSER_PASSWORD: postgres
      ARTEPOOL_DB: artepool_dev
      ARTEPOOL_TEST_DB: artepool_test
      ARTEPOOL_MIGRATOR_PASSWORD: ci-only-migrator
      ARTEPOOL_API_PASSWORD: ci-only-api
      ARTEPOOL_BACKUP_PASSWORD: ci-only-backup
      ARTEPOOL_MAINT_PASSWORD: ci-only-maint
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy -p artepool-bridge -p artepool-printer -p artepool-svc -p artepool-emergency --all-targets -- -D warnings
      - name: Tests (protocol vectors, TLS rules, enrollment and renewal; the RAW receipt printer; the service launcher)
        run: cargo test -p artepool-bridge -p artepool-printer -p artepool-svc -p artepool-emergency
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Enroll through the Rust bridge against the real API
        run: |
          cd ../ && (pnpm exec tsx e2e/harness/harness.ts > harness.log 2>&1 &) && cd src-tauri
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:1529/ready > ready.json && break; sleep 2; done
          API=$(node -e "console.log(new URL(require('./ready.json').api).host)")
          CODE=$(curl -sf -X POST -H 'content-type: application/json' -d '{}' http://127.0.0.1:1529/enrollment-code | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).code))")
          cargo run -p artepool-bridge --example enroll_check -- "$API" "$CODE" RUST-CI

  windows:
    name: Windows app (build and test)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Rust tests on Windows (including Windows Credential Manager, DPAPI and folder access rules)
        run: cargo test --workspace --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Service launcher and emergency tool lints on Windows
        run: cargo clippy -p artepool-svc -p artepool-emergency --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - name: Build the packaged server (Windows Argon2 library included)
        run: pnpm build:server --windows
      - name: Build the service launcher and the emergency tool
        run: cargo build --release -p artepool-svc -p artepool-emergency --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Packaged server
        uses: actions/upload-artifact@v4
        with:
          name: artepool-server-windows
          path: |
            dist/server
            apps/desktop/src-tauri/target/release/artepool-svc.exe
            apps/desktop/src-tauri/target/release/artepool-emergency.exe
          retention-days: 14
      - name: Build the installer
        run: pnpm build:desktop
      - name: Installer
        uses: actions/upload-artifact@v4
        with:
          name: artepool-erp-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
      - name: Server installer (pinned PostgreSQL, Node and WinSW, each checked by SHA-256), and two test upgrades
        run: pnpm build:installer --test-upgrade
      - name: Install, upgrade, restore and uninstall the server as on a clean PC
        shell: pwsh
        run: ./tools/installer/windows/test-install.ps1 -Installer (Get-ChildItem dist/installer/ARTEPOOL-Server-Setup-*.exe).FullName
      - name: Server installer
        uses: actions/upload-artifact@v4
        with:
          name: artepool-server-setup
          path: |
            dist/installer/ARTEPOOL-Server-Setup-*.exe
            dist/installer/ARTEPOOL-Office-Setup-*.exe
            dist/installer/SHA256SUMS.txt
          retention-days: 14
      # For trying an upgrade by hand on a test PC or VM (never the shop PC): the next version
      # (works) and the one after (its migration fails, so the previous version comes back).
      - name: Test upgrades (for a test PC only, never published)
        uses: actions/upload-artifact@v4
        with:
          name: artepool-test-upgrades
          path: dist/installer/test/ARTEPOOL-Server-Setup-*.exe
          retention-days: 14
      - name: Installation logs (for review; they hold no secret)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artepool-install-logs
          path: C:/ProgramData/ARTEPOOL/logs
          retention-days: 14
          if-no-files-found: ignore
