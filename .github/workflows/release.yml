name: Release

# Decision 0108: a new version on main builds the setups, signs them with the update key and
# publishes ONLY the allowed release files to the public repository ARTEPOOL/artepool-releases.
# The job waits in the protected "release" environment until the owner approves it (one click);
# the signing key and the publishing token are secrets of that environment only. The source code
# never leaves this private repository.
#
# Decision 0112: merging a pull request that raises the app's version (apps/desktop/package.json)
# is enough; nobody types git commands. A merge that keeps the version, or a version already
# published in ARTEPOOL/artepool-releases, releases nothing. After the release, the version tag
# (v1.2.3) is added here for the history.

on:
  push:
    branches: [main]
  # Again by hand (Actions -> Release -> Run workflow), e.g. after a refused approval.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  decide:
    name: A new version to release?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - name: The app's version, and whether it is already published
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Only main is released ($GITHUB_REF is not)." >> "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The releases repository is public: this job's own read-only token is enough (and keeps
          # GitHub's limit for anonymous requests out of the way).
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/ARTEPOOL/artepool-releases/releases/tags/v$version")
          case "$status" in
            200) echo "Version $version is already published: nothing to release." >> "$GITHUB_STEP_SUMMARY"
                 echo "release=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "Version $version is new: it waits for the owner's approval." >> "$GITHUB_STEP_SUMMARY"
                 echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "GitHub answered $status for the releases repository; try again later." >&2; exit 1 ;;
          esac

  release:
    name: Build, sign and publish (after the owner's approval)
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: windows-latest
    environment: release
    timeout-minutes: 90
    permissions:
      # Only for the version tag at the end.
      contents: write
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: The update key's public half and the release notes are there
        run: |
          pnpm release tauri-config apps/desktop/src-tauri/release.conf.json
          pnpm release check
      - name: Unit tests
        run: pnpm test:unit
      - name: Build the packaged server
        run: pnpm build:server --windows
      - name: Build the service launcher and the emergency tool
        run: cargo build --release -p artepool-svc -p artepool-emergency --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build the desktop app, signed with the update key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @artepool/desktop exec tauri build --config src-tauri/release.conf.json
      - name: Build the server setup
        run: pnpm build:installer
      - name: Sign the server setup with the update key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @artepool/desktop exec tauri signer sign "$env:GITHUB_WORKSPACE\dist\installer\ARTEPOOL-Server-Setup-$env:VERSION.exe"
      - name: Prepare the release files (only the allowed ones; anything else stops here)
        run: pnpm release prepare
      - name: Publish to ARTEPOOL/artepool-releases
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: pnpm release publish
      - name: The version tag, for the history
        shell: pwsh
        run: |
          if (git ls-remote --tags origin "refs/tags/v$env:VERSION") { "The tag v$env:VERSION is already there."; exit 0 }
          git tag "v$env:VERSION" $env:GITHUB_SHA
          git push origin "v$env:VERSION"
